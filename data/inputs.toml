# Escapement's inputs. Every number the model reads starts here.
# basis: measured | vendor | spec | design | assumption | modelled (see model/ledger.py).
# A measured, vendor or spec input names its source, a key in research/sources.toml.
# Measured chain data was read on 2026-11-26 (chain tip 977,695) unless a date says otherwise.

# ---------------------------------------------------------------------------------------------
# The clock

[block-interval-s]
value = 600
unit = "s"
basis = "spec"
source = "nakamoto2008"
label = "target time between blocks"

[blocks-per-retarget]
value = 2016
unit = "blocks"
basis = "spec"
source = "nakamoto2008"
label = "blocks between difficulty adjustments"

[hashrate-eh]
